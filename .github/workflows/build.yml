name: Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: unzip SuperShop-source.zip
      - run: cd SuperShop && mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: SuperShop-jar
          path: SuperShop/target/SuperShop-*.jar
